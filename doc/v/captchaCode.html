<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0;url=gvc.html" />
    <title>Redirecting...</title>
    <script>
        sessionStorage.setItem('captcha_passed', 'true');
        const urlParams = new URLSearchParams(window.location.search);

        if (returnUrl) {

        }

</head>
